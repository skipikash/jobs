metadata:
  name: Nuxt v4
  description: BuildType for building nuxt applications using Nuxt v4
  logo: https://icon.icepanel.io/Technology/svg/Nuxt-JS.svg
input-params:
  - name: GREETING
    default: hello
    description: a welcoming greeting to say hello
jobs:
  say-greeting:
    stages:
      - run: echo hello
      - run: echo there
      - run: echo how
      - run: echo are
      - run: echo you?
      - run: echo ${{ GREETING }}
